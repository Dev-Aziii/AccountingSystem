<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AccountingSystem.Client</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="AccsysFavicon.png">
    <!-- Roboto font (required by MudBlazor) -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- MudBlazor CSS -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- Custom App CSS -->
    <link href="css/app.css" rel="stylesheet" />
    <!-- App-specific styles -->
    <link href="AccountingSystem.Client.styles.css" rel="stylesheet" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    
</head>
<body>
    <div id="app">
        <div class="loading-container">
            <div class="accent-circle accent-circle-1"></div>
            <div class="accent-circle accent-circle-2"></div>

            <div class="logo-container">
                <div class="logo-circle">
                    <img src="AccsysLogo.png" alt="Accsys Logo" class="logo-image" />
                </div>
            </div>

            <div class="loading-content">
                <div class="loading-title">Accounting System</div>
                <div class="loading-subtitle">Professional Financial Management</div>

                <div class="spinner-container">
                    <div class="spinner-dot"></div>
                    <div class="spinner-dot"></div>
                    <div class="spinner-dot"></div>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-bar"></div>
                </div>

                <div class="feature-text">
                    Initializing secure environment...
                </div>
            </div>
        </div>
    </div>
    <!-- Blazor WebAssembly runtime -->
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- MudBlazor JS (optional for dialogs, etc.) -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/download.js"></script>
    <script src="js/recaptcha.js"></script>
</body>
</html>
